setting.ai-commander.enabled.name=Enable AI Commander
setting.ai-commander.enabled.description=Turns the in-game commander on or off.

setting.ai-commander.auto-start.name=Auto-start on Fortress
setting.ai-commander.auto-start.description=Attach automatically when the Fortress survival map loads. A manual Start button is always available in the HUD.

setting.ai-commander.base-url.name=opencode base URL
setting.ai-commander.base-url.description=Local opencode server URL. Default is the local relay on port 4098. Use http://127.0.0.1:4097 for the server directly.

setting.ai-commander.username.name=Basic auth username
setting.ai-commander.username.description=Leave blank when using the unauthenticated local relay.

setting.ai-commander.password.name=Basic auth password
setting.ai-commander.password.description=Leave blank when using the unauthenticated local relay.

setting.ai-commander.provider.name=Model provider
setting.ai-commander.provider.description=Provider ID passed to the opencode server, for example: opencode

setting.ai-commander.model.name=Model ID
setting.ai-commander.model.description=Model ID passed to the opencode server, for example: deepseek-v4.1-flash-free

setting.ai-commander.interval.name=Commander interval
setting.ai-commander.interval.description=Seconds between commander calls while the match is running.
